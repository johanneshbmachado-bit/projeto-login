<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-querie.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="foto">
                <!--Imagen no Css-->
            </div>
            <div id="form">
                <h1>Login</h1>

                <p>seja Bem-Vindo, entre com a sua conta e aproveite o maximo q nosso site tem a oferecer</p>

                <form action="index.html" method="post">

                    <div class="forms">
                        <label for="iemail">Email:</label>

                        <input type="email" name="email" id="iemail" required placeholder="coloque seu email">
                    </div>

                   <div class="forms">
                        <label for="isenha">Senha:</label>

                        <input type="password" name="senha" id="isenha" required placeholder="coloque sua senha" minlength="8">
                    </div> 

                    <div class="enviar"><input type="submit" value="Entrar"></div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
